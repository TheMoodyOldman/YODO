{% extends "base.html" %}
{% block title %}登入 · 友多聞 YODO{% endblock %}

{% block content %}
<section class="narrow">
  <h1>登入</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label>帳號
      <input name="username" value="{{ form.username or '' }}" required autocomplete="username" autocapitalize="none">
    </label>
    <label>密碼
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn">登入</button>
  </form>
  <p class="muted">還沒有帳號？<a href="/register">註冊</a></p>
</section>
{% endblock %}
