{% extends "base.html" %}

{% block content %}
<section class="hero">
  <h1>你的跨平台興趣名片</h1>
  <p class="muted">把遊戲、動畫、音樂的喜好放在同一頁，貼在 IG 簡介，讓朋友一眼看懂你的品味。</p>
  {% if me %}
    <p><a class="btn" href="/u/{{ me.username }}">查看我的頁面</a> <a class="btn secondary" href="/me/collection">管理收藏</a></p>
  {% else %}
    <p><a class="btn" href="/register">建立我的名片</a> <a class="btn secondary" href="/login">登入</a></p>
  {% endif %}
</section>
{% endblock %}
